name: Security — Weekly Dependency Scan

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      issues: write       # Create issues for found vulnerabilities
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      # ── npm audit ──────────────────────────────────────────────────────
      - name: npm audit (all levels)
        id: audit
        working-directory: ./frontend
        run: |
          npm audit --json > /tmp/audit.json || true
          CRITICAL=$(cat /tmp/audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat /tmp/audit.json | jq '.metadata.vulnerabilities.high // 0')
          MODERATE=$(cat /tmp/audit.json | jq '.metadata.vulnerabilities.moderate // 0')
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "### Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY

      # ── Create GitHub issue if critical/high vulns found ──────────────
      - name: Create issue for vulnerabilities
        if: steps.audit.outputs.critical != '0' || steps.audit.outputs.high != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const critical = ${{ steps.audit.outputs.critical }};
            const high = ${{ steps.audit.outputs.high }};
            const date = new Date().toISOString().split('T')[0];

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security', 'dependencies'],
              state: 'open',
            });

            // Don't create duplicates if issue already open
            const alreadyOpen = issues.some(i => i.title.includes('Dependency Vulnerabilities'));
            if (alreadyOpen) {
              console.log('Security issue already open — skipping creation');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔐 Dependency Vulnerabilities Found — ${date}`,
              body: [
                '## Security Alert — Dependency Vulnerabilities',
                '',
                `Automated weekly scan found vulnerabilities in \`frontend/\`:`,
                '',
                `| Severity | Count |`,
                `|---|---|`,
                `| 🔴 Critical | ${critical} |`,
                `| 🟠 High | ${high} |`,
                '',
                '**Action required:** Run `npm audit` locally and update affected packages.',
                '',
                '```bash',
                'cd frontend',
                'npm audit',
                'npm audit fix',
                '# For breaking changes:',
                'npm audit fix --force',
                '```',
                '',
                `Scan triggered by: ${context.workflow} / ${context.runId}`,
              ].join('\n'),
              labels: ['security', 'dependencies', 'high-priority'],
            });

      # ── Check for outdated packages ───────────────────────────────────
      - name: Check for outdated packages
        working-directory: ./frontend
        run: |
          echo "### Outdated Packages" >> $GITHUB_STEP_SUMMARY
          npm outdated --json | jq -r '
            to_entries[] |
            "| \(.key) | \(.value.current) | \(.value.latest) |"
          ' | head -20 >> $GITHUB_STEP_SUMMARY || true
