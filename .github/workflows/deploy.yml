name: Deploy specpart to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ORACLE_HOST: 84.8.254.244
  ORACLE_USER: ubuntu
  DEPLOY_DIR: /opt/kiosquetn
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/reflx0/e-comerce

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Migrate image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SITE_URL=http://84.8.254.244:8082
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle VM (Zero Downtime)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying specpart via GHCR ==="
            
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}
            
            # Pull latest docker-compose.yml and nginx config
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/REFLX0/e-comerce.git .
            fi
            
            # Ensure correct nginx config
            cp nginx/nginx.prod.conf nginx/nginx.conf
            
            # Log in to GHCR on the VM to pull private images (optional if repository is public)
            # echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the pre-built images (Fast, no CPU spike)
            docker compose -p achref pull backend frontend migrate db redis nginx
            
            # Remove any stale migrate containers from prior runs (merged from HEAD)
            docker ps -aq --filter name=migrate | xargs -r docker rm -f || true
            
            # Run database migrations (one-shot)
            docker compose -p achref up migrate
            
            # Rebuild and restart frontend (remove stale container if any - merged from HEAD)
            docker rm -f specpart-frontend 2>/dev/null || true
            
            # Recreate containers instantly with new images
            docker compose -p achref up -d --no-build
            
            # Clean up old images
            docker image prune -f
            
            echo "=== Deployment done — specpart live on http://84.8.254.244:8082 ==="
