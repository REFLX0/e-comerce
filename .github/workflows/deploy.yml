name: Deploy specpart to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ORACLE_HOST: 84.8.254.244
  ORACLE_USER: ubuntu
  DEPLOY_DIR: /opt/specpart

jobs:
  build-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript Check
        run: npx tsc --noEmit
        working-directory: frontend

  deploy:
    name: Deploy to Oracle VM (port 8082)
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying specpart (port 8082) ==="
            
            # Create deploy dir if first time
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}
            
            # Pull latest code (or clone if first deploy)
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/REFLX0/e-comerce.git .
            fi
            
            # Use the production nginx config (port 8082, no SSL)
            cp nginx/nginx.prod.conf nginx/nginx.conf
            
            # Rolling rebuild — restart services one by one to minimize downtime
            docker compose -p achref pull db redis || true
            docker compose -p achref up -d db redis
            
            # Run database migrations (one-shot, waits for completion)
            # Remove any stale migrate containers from prior runs
            docker ps -aq --filter name=migrate | xargs -r docker rm -f
            docker compose -p achref up --build --remove-orphans migrate
            
            # Rebuild and restart backend replicas
            docker compose -p achref up -d --build --no-deps backend
            sleep 10
            
            # Rebuild and restart frontend (remove stale container if any)
            docker rm -f specpart-frontend 2>/dev/null || true
            docker compose -p achref up -d --build --no-deps --remove-orphans frontend
            sleep 5
            
            # Ensure nginx is up
            docker compose -p achref up -d nginx
            
            # Clean up dangling images
            docker image prune -f
            
            echo "=== Deployment done — specpart live on http://84.8.254.244:8082 ==="

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sleep 20
            curl -sf http://84.8.254.244:8082/api/health && echo "✓ API is healthy" || echo "✗ API health check failed"
            curl -sf http://84.8.254.244:8082 | head -5 && echo "✓ Frontend is healthy" || echo "✗ Frontend health check failed"
