name: Deploy specpart to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ORACLE_HOST: 84.8.254.244
  ORACLE_USER: ubuntu
  DEPLOY_DIR: /opt/kiosquetn
  IMAGE_PREFIX: specpart

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Migrate image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SITE_URL=http://84.8.254.244:8082
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Images to Tar
        run: docker save ${{ env.IMAGE_PREFIX }}-frontend:latest ${{ env.IMAGE_PREFIX }}-backend:latest ${{ env.IMAGE_PREFIX }}-migrate:latest | gzip > images.tar.gz

      - name: Copy Images to Oracle VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "images.tar.gz"
          target: "${{ env.DEPLOY_DIR }}"

  deploy:
    name: Deploy to Oracle VM (Zero Downtime)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying specpart via GHCR ==="
            
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}
            
            # Pull latest docker-compose.yml and nginx config
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/REFLX0/e-comerce.git .
            fi
            
            # Ensure correct nginx config
            cp nginx/nginx.prod.conf nginx/nginx.conf
            
            # Load the pre-built images from the tar file
            docker load -i images.tar.gz
            rm -f images.tar.gz
            
            # Remove any stale migrate containers from prior runs (merged from HEAD)
            docker ps -aq --filter name=migrate | xargs -r docker rm -f || true
            
            # Pull external images (Fast, no CPU spike)
            docker compose -p achref pull db redis nginx          
            
            # Rebuild and restart frontend (remove stale container if any - merged from HEAD)
            docker rm -f specpart-frontend 2>/dev/null || true
            
            # Run database migrations (one-shot)
            docker compose -p achref up migrate
            
            # Recreate containers instantly with new images
            docker compose -p achref up -d --no-build
            
            # Clean up old images
            docker image prune -f
            
            echo "=== Deployment done — specpart live on http://84.8.254.244:8082 ==="
