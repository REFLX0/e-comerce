name: Deploy specpart to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: 13.49.134.212
  SERVER_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/e-comerce
  IMAGE_PREFIX: specpart
  DOMAIN: specpart.tech

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying specpart to AWS EC2 (specpart.tech) ==="
            
            cd ${{ env.DEPLOY_DIR }}
            
            # Pull latest changes from GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Apply DB migrations & full catalogue reorganization
            docker exec -i specpart-db psql -U specpart -d specpart -c 'ALTER TABLE public."Product" ADD COLUMN IF NOT EXISTS "shortDescription" TEXT;' || true
            docker exec -i specpart-db psql -U specpart -d specpart < backend/prisma/precise-catalogue-reorganization.sql || true
            docker compose exec -T redis redis-cli FLUSHALL || true
            
            # Build and update modified containers automatically
            docker compose build frontend backend
            docker compose up -d --no-deps frontend backend nginx
            
            # Clean up dangling build cache to save disk space
            docker image prune -f
            
            echo "=== Deployment successful: https://specpart.tech ==="

