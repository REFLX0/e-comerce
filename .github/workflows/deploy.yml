name: Deploy specpart to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: 13.49.134.212
  SERVER_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/e-comerce
  IMAGE_PREFIX: specpart
  DOMAIN: specpart.tech

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying specpart to AWS EC2 (specpart.tech) ==="
            
            cd ${{ env.DEPLOY_DIR }}
            
            # Pull latest changes from GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Build custom app images
            docker compose build frontend backend
            # Start/update ALL services defined in docker-compose.yml
            docker compose up -d
            
            # Run Prisma migrations to create/update any new DB tables
            echo "--- Running DB migrations ---"
            docker compose exec -T backend npx prisma migrate deploy || true
            
            # Flush Redis cache to pick up any code changes
            docker compose exec -T redis redis-cli FLUSHALL || true
            
            # Clean up dangling build cache to save disk space
            docker image prune -f
            
            echo "=== Deployment successful: https://specpart.tech ==="

