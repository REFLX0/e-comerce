
services:
  # ── Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: specpart-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"
    environment:
      # The config is a template; the image's envsubst step renders it to
      # /etc/nginx/nginx.conf at start. DOMAIN is the single value that changes
      # when the site moves to another domain (server_name + cert paths).
      - DOMAIN=${DOMAIN:?DOMAIN is required}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./uploads:/srv/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    # Reload every 6h so a certificate renewed by the certbot service is picked
    # up. Nothing did this before, so even a successful renewal would not have
    # reached the running nginx until the next manual restart.
    #
    # /docker-entrypoint.sh is invoked explicitly: the image only runs its init
    # scripts (including the envsubst template render) when its first argument
    # is `nginx`, so overriding `command` with a shell would otherwise silently
    # skip the templating and leave /etc/nginx/nginx.conf as the stock default.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    mem_limit: 128m
    cpus: 0.5
    networks:
      - frontend-net
      - backend-net

  # ── SSL Certificates ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: certbot
    # These MUST be the same host paths nginx reads. They used to be the named
    # volumes certbot-etc / certbot-var, which nginx never mounted: the ACME
    # challenge was written where nginx could not serve it, so renewal failed,
    # and a renewed certificate would have landed somewhere nginx never looks.
    # The certificate simply expired and took the site down with it.
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    mem_limit: 128m
    cpus: 0.25

  # ── Database Backups ──────────────────────────────────────────────
  pg-backups:
    image: prodrigestivill/postgres-backup-local
    container_name: specpart-pg-backups
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    networks:
      - backend-net

  # ── Backend API (NestJS) ──────────────────────────────────────────
  backend:
    image: specpart-backend:latest
    container_name: specpart-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: backend/.env
    environment:
      - NODE_ENV=production
      # NOTE: connection_limit / pool_timeout in the URL are Prisma *engine*
      # options and are ignored when a driver adapter is used - this app uses
      # @prisma/adapter-pg, so the pool is the pg Pool configured in
      # PrismaService. Set DATABASE_POOL_SIZE to change the cap.
      # Measured (2026-09-14): max_connections=100, 7 live connections at idle.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/app/uploads
      - ./oil-finder-full-dataset:/app/oil-finder-full-dataset
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 768m
    cpus: 1.5
    networks:
      - backend-net

  # ── Database Migrations (one-shot) ────────────────────────────────
  # This used to be `node -e "console.log('DB migration ready')"` - a no-op that
  # printed a reassuring line and applied nothing. It now actually runs the
  # migrations, and `backend` waits for it to exit 0, so a failed migration
  # stops the deploy instead of leaving the API running against a stale schema.
  migrate:
    image: specpart-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    # Direct binary rather than `npx`: the container runs as an unprivileged
    # system user, and npx can try to touch a HOME-relative cache it cannot
    # write. prisma is a production dependency, so the binary is always present.
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend-net

  # ── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    image: specpart-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_SITE_URL=${NEXTAUTH_URL}
    container_name: specpart-frontend
    env_file: backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Internal API proxy: Next.js rewrites /api/* → nginx → backend
      - API_PROXY_ORIGIN=http://nginx:8082
      # Direct server-side URL so SSR bypasses rewrites and calls nginx directly
      - API_URL=http://nginx:8082/api
      - NEXT_PUBLIC_API_URL=/api
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - frontend-net
      - backend-net

  # ── PostgreSQL Primary ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: specpart-db
    shm_size: 1gb
    env_file: backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # Configure Postgres for streaming replication, plus memory/planner tuning off
    # the factory defaults (measured 2026-09-14: shared_buffers=128MB, work_mem=4MB,
    # effective_cache_size=4GB, random_page_cost=4 — all untouched stock values on a
    # 7.6GB host with ~2.5GB available and EBS SSD-backed storage). Kept conservative:
    # this host runs 12+ other containers, not a dedicated DB box.
    command: ["postgres",
      "-c", "wal_level=replica", "-c", "max_wal_senders=3", "-c", "max_replication_slots=3", "-c", "hot_standby=on",
      "-c", "shared_buffers=512MB",
      "-c", "effective_cache_size=2GB",
      "-c", "work_mem=8MB",
      "-c", "maintenance_work_mem=128MB",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200"
    ]
    volumes:
      - specpart_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-replication-hba.sh:/docker-entrypoint-initdb.d/init-replication-hba.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1536m
    cpus: 1.5
    networks:
      - backend-net

  # ── PostgreSQL Replica (Hot Standby) ──────────────────────────────
  db-replica:
    image: postgres:16-alpine
    container_name: specpart-db-replica
    shm_size: 1gb
    env_file: backend/.env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # If the data dir is empty, take a base backup from 'db', then start postgres.
    # Must run pg_basebackup and postgres itself as the unprivileged `postgres`
    # user (via gosu) rather than as root (the container's default user) —
    # postgres refuses outright to run as root, and running pg_basebackup as
    # root leaves every copied file root-owned, which postgres then can't
    # read even after switching users. Docker also creates a fresh named
    # volume's mountpoint as world-writable (1777), which postgres rejects
    # outright regardless of ownership, hence the chmod. Both are cheap,
    # idempotent safety nets for data dirs already initialized this way by
    # an earlier version of this command.
    command: |
      sh -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Initializing replica from primary...'
        gosu postgres pg_basebackup -h db -D /var/lib/postgresql/data -U ${POSTGRES_USER} -Fp -Xs -R
      fi
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 700 /var/lib/postgresql/data
      exec gosu postgres postgres
      "
    volumes:
      - specpart_pgdata_replica:/var/lib/postgresql/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    cpus: 1.0
    networks:
      - backend-net

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: specpart-redis
    # NOTE: Do NOT expose port 6379 externally in production.
    volumes:
      - specpart_redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - backend-net

  # ── MinIO (S3 Compatible Storage) ─────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: specpart-minio
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 384m
    cpus: 0.5
    networks:
      - backend-net

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: specpart-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend-net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/specpart-images --ignore-existing;
      echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::specpart-images/*\"]}]}' > /tmp/policy.json;
      mc anonymous set-json /tmp/policy.json myminio/specpart-images;
      exit 0;
      "
  # ── OpenSearch (Product Search Engine) ───────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: specpart-opensearch
    environment:
      - cluster.name=specpart-cluster
      - node.name=specpart-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Disable security plugin for internal-only access (no public exposure)
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-Specpart@2024!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1536m
    cpus: 1.0
    networks:
      - backend-net

  # ── OpenSearch Dashboards (Visual UI for Search) ────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: specpart-opensearch-dashboards
    ports:
      - "127.0.0.1:5601:5601"   # OpenSearch Dashboards Web UI
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    networks:
      - backend-net

  # ── Kafka (Message Broker - KRaft Mode) ──────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: specpart-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Explicit heap cap — the image otherwise defaults to -Xmx1G, which measured
      # ~953MB RSS with no ceiling. 768m heap + mem_limit below leaves off-heap room.
      KAFKA_HEAP_OPTS: "-Xms768m -Xmx768m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 1.0
    networks:
      - backend-net

  # ── Kafka UI (Web Interface for Kafka) ────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: specpart-kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: specpart
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  specpart_pgdata:
  specpart_pgdata_replica:
  specpart_redis:
  minio_data:
  opensearch_data:
  kafka_data:
