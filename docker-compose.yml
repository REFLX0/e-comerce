version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    # A REMPLACER : Configurez ici l'image ou le build de votre futur backend
    image: alpine # Image temporaire pour que docker-compose fonctionne
    command: tail -f /dev/null # Commande temporaire pour garder le conteneur actif
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    restart: unless-stopped
