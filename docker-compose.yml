version: '3.8'

services:
  # ── Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: specpart-nginx
    ports:
      - "8082:8082"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - frontend-net
      - backend-net

  # ── Backend API (NestJS) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No container_name — allows replicas
    deploy:
      replicas: 2
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-specpart}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-specpart}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=${NEXTAUTH_URL:-http://84.8.254.244:8082}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend-net

  # ── Database Migrations (one-shot) ────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-specpart}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-specpart}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend-net

  # ── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_SITE_URL=${NEXTAUTH_URL:-http://84.8.254.244:8082}
    container_name: specpart-frontend
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_URL=http://nginx:8082/api
      - NEXT_PUBLIC_API_URL=/api
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://84.8.254.244:8082}
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-specpart}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-specpart}?schema=public
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "84.8.254.244:host-gateway"
    restart: unless-stopped
    networks:
      - frontend-net
      - backend-net

  # ── PostgreSQL ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: specpart-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-specpart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-specpart}
    ports:
      - "5433:5432"
    volumes:
      - specpart_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specpart} -d ${POSTGRES_DB:-specpart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: specpart-redis
    ports:
      - "6380:6379"
    volumes:
      - specpart_redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

# ── Networks ──────────────────────────────────────────────────────
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  specpart_pgdata:
  specpart_redis:
