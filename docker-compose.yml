version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: kiosquetn-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # We remove container_name so Docker Compose can spin up multiple replicas
    # We remove external port mapping so it's only accessible via NGINX
    deploy:
      replicas: 2
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://kiosquetn:${POSTGRES_PASSWORD:-changeme}@db:5432/kiosquetn?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FRONTEND_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiosquetn-frontend
    # We remove external port mapping so it's only accessible via NGINX
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXTAUTH_URL=http://localhost
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - DATABASE_URL=postgresql://kiosquetn:${POSTGRES_PASSWORD:-changeme}@db:5432/kiosquetn?schema=public
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: kiosquetn-db
    environment:
      POSTGRES_USER: kiosquetn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: kiosquetn
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with nexus-aid's postgres on 5432
    volumes:
      - kiosquetn_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kiosquetn-redis
    ports:
      - "6380:6379"  # Use 6380 to avoid conflict with nexus-aid's redis on 6379
    volumes:
      - kiosquetn_redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  kiosquetn_pgdata:
  kiosquetn_redis:

