events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Basic Performance ──────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;

    # ── Real IP (trust Cloudflare / upstream proxy headers) ────────────────────
    # Without this, all clients share the Docker-bridge IP (172.18.0.x)
    # and a single user retrying login exhausts the rate-limit for everyone.
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  172.16.0.0/12;   # Docker internal networks
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  192.168.0.0/16;
    # Cloudflare IPv4 ranges
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # Cloudflare IPv6 ranges
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/m;

    # DNS Resolver for Docker dynamically resolving IP addresses to avoid 502 Bad Gateway
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP Server (Port 80) -> Redirect to HTTPS ────────────────────────────
    server {
        listen 80;
        server_name specpart.tech www.specpart.tech _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Main Server (Port 443 & Port 8082) ───────────────────────────────
    server {
        listen 443 ssl;
        listen 8082;
        server_name specpart.tech www.specpart.tech _;

        ssl_certificate     /etc/letsencrypt/live/specpart.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/specpart.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        set $backend "backend:4000";
        set $frontend "frontend:3000";

        # ── Security Headers ───────────────────────────────────────────────────
        # Handled authoritatively by Next.js middleware (frontend) and NestJS Helmet (backend)
        # to prevent duplicate headers in responses.

        # ── Nest Auth Routes — extra rate limiting ────────────────────────────
        location = /api/auth/login {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass cookies through (HttpOnly JWT)
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/register {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/logout {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/refresh {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/forgot-password {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/reset-password {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        # ── Explicit NextAuth / Auth.js Routes ────────────────────────────────
        # These must stay on the frontend, not Nest.
        location ~ ^/api/auth/(error|signin|signout|session|csrf|providers|callback|verify-request) {
            proxy_pass http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_cache_bypass $http_upgrade;
        }

        # ── NextAuth / Auth.js Routes ──────────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Chatbot API ────────────────────────────────────────────────────────
        location /api/chat {
            limit_req zone=chat_limit burst=5 nodelay;

            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Backend API ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            # Pass cookies through (HttpOnly JWT)
            proxy_pass_header Set-Cookie;
        }

        # ── Next.js Static Assets ──────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://$frontend;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ── TecDoc Product Images (mounted from ./autopart_db/images) ─────────
        location /images/ {
            alias /srv/product-images/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        location ~ ^/(en|fr|ar)/images/(.*)$ {
            alias /srv/product-images/$2;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ── Public Media ───────────────────────────────────────────────────────
        location /media/ {
            proxy_pass http://$frontend;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ── Local Uploads (fallback when Cloudinary is not configured) ────────
        location /uploads/ {
            proxy_pass http://$backend;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        location = /favicon.ico { proxy_pass http://$frontend; access_log off; }
        location = /robots.txt  { proxy_pass http://$frontend; access_log off; }

        # ── Block common scanner / WordPress probes ────────────────────────────
        location ~* ^/(en|fr)?/wp-(admin|login|content|includes) {
            deny all;
            return 444;
        }
        location ~* \.(php|asp|aspx|cgi|pl)$ {
            deny all;
            return 444;
        }

        # ── MinIO Object Storage (S3) ─────────────────────────────────────────
        # Images are served via /storage/ proxy. Listing is blocked at the
        # policy level in MinIO (s3:ListBucket is not granted). autoindex is
        # explicitly disabled here as a defense-in-depth measure.
        location /storage/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            autoindex off;
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ── Frontend ───────────────────────────────────────────────────────────
        location / {
            proxy_pass http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
