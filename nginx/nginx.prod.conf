events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Basic Performance ──────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;

    # ── Real IP (trust Cloudflare / upstream proxy headers) ────────────────────
    # Without this, all clients share the Docker-bridge IP (172.18.0.x)
    # and a single user retrying login exhausts the rate-limit for everyone.
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from  172.16.0.0/12;   # Docker internal networks
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  192.168.0.0/16;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream backend_cluster {
        least_conn;
        server backend:4000;
        keepalive 32;
    }

    upstream frontend_cluster {
        server frontend:3000;
        keepalive 16;
    }

    # ── Main Server (port 8082) ────────────────────────────────────────────────
    server {
        listen 8082;
        server_name _;  # Accept any hostname / direct IP access

        # ── Security Headers ───────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Nest Auth Routes — extra rate limiting ────────────────────────────
        location = /api/auth/login {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://backend_cluster/api/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass cookies through (HttpOnly JWT)
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/register {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://backend_cluster/api/auth/register;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/logout {
            proxy_pass http://backend_cluster/api/auth/logout;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/refresh {
            proxy_pass http://backend_cluster/api/auth/refresh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/forgot-password {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_cluster/api/auth/forgot-password;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/auth/reset-password {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_cluster/api/auth/reset-password;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        # ── Explicit NextAuth / Auth.js Routes ────────────────────────────────
        # These must stay on the frontend, not Nest.
        location ~ ^/api/auth/(error|signin|signout|session|csrf|providers|callback|verify-request) {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── NextAuth / Auth.js Routes ──────────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Backend API ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_cluster/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            # Pass cookies through (HttpOnly JWT)
            proxy_pass_header Set-Cookie;
        }

        # ── Next.js Static Assets ──────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend_cluster;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ── Public Media ───────────────────────────────────────────────────────
        location /media/ {
            proxy_pass http://frontend_cluster;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ── Local Uploads (fallback when Cloudinary is not configured) ────────
        location /uploads/ {
            proxy_pass http://backend_cluster;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        location = /favicon.ico { proxy_pass http://frontend_cluster; access_log off; }
        location = /robots.txt  { proxy_pass http://frontend_cluster; access_log off; }

        # ── Block common scanner / WordPress probes ────────────────────────────
        location ~* ^/(en|fr)?/wp-(admin|login|content|includes) {
            deny all;
            return 444;
        }
        location ~* \.(php|asp|aspx|cgi|pl)$ {
            deny all;
            return 444;
        }

        # ── Frontend ───────────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
